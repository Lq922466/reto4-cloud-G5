<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura Cloud — Grupo 5</title><desc id="desc">Codespaces administra mediante Terraform cuatro instancias EC2 en AWS. Docker Swarm coordina un manager y tres workers. Los nodos descargan las imágenes de Docker Hub y sirven la web a los usuarios.</desc>

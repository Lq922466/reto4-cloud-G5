# Configuración aplicada en los cuatro nodos como /etc/ssh/sshd_config.d/00-reto4.conf.
# La instala terraform/scripts/bootstrap.sh.tftpl al arrancar cada instancia.
# Comprobación: sudo sshd -T | grep -E '^(permitrootlogin|passwordauthentication) '
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
